[build]
  # Build command - no build needed for static HTML
  command = "echo 'No build needed'"
  # Publish directory - where your index.html is
  publish = "frontend"

# Redirect all requests to index.html for SPA routing (optional)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
